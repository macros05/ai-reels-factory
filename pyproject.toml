[project]
name = "ai-reels-factory"
version = "0.1.0"
description = "End-to-end pipeline that generates hyperrealistic AI reels ready to publish on Instagram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.39.0",
    "elevenlabs>=1.50.0",
    "httpx>=0.27.0",
    "ffmpeg-python>=0.2.0",
    "whisper-timestamped>=1.15.0",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "yt-dlp>=2024.10.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
